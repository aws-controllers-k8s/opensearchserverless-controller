ignore:
  resource_names:
      # - AccessPolicy
      # - Collection
      # - LifecyclePolicy
      # The SDK upgrade is scoped to CollectionGroup and Collection membership.
      - Index
      - IngestionJob
      - IngestionStream
      - SecurityConfig
      # - SecurityPolicy
      - VpcEndpoint
  field_paths:
      - CreateSecurityPolicyOutput.SecurityPolicyDetail.Policy
      - CreateSecurityPolicyOutput.SecurityPolicyDetail.ClientToken
      - CreateSecurityPolicyInput.ClientToken
      - CreateAccessPolicyOutput.AccessPolicyDetail.Policy
      - CreateAccessPolicyInput.ClientToken
      - CreateCollectionInput.ClientToken
      - CreateCollectionInput.VectorOptions
      - CreateCollectionInput.EncryptionConfig
      - CreateCollectionInput.DeletionProtection
      - CreateCollectionOutput.CreateCollectionDetail.VectorOptions
      - CreateCollectionOutput.CreateCollectionDetail.DeletionProtection
      - BatchGetCollectionOutput.CollectionDetails.VectorOptions
      - BatchGetCollectionOutput.CollectionDetails.DeletionProtection
      - BatchGetCollectionOutput.CollectionDetails.FipsEndpoints
      - UpdateCollectionInput.VectorOptions
      - UpdateCollectionInput.EncryptionConfig
      - UpdateCollectionInput.DeletionProtection
      - UpdateCollectionOutput.UpdateCollectionDetail.VectorOptions
      - UpdateCollectionOutput.UpdateCollectionDetail.DeletionProtection
      - CreateCollectionGroupInput.ClientToken
      - UpdateCollectionGroupInput.ClientToken
      - UpdateCollectionGroupOutput.UpdateCollectionGroupDetail.LastModifiedDate
      - CreateLifecyclePolicyOutput.LifecyclePolicyDetail.Policy
      - CreateLifecyclePolicyInput.ClientToken
      - UpdateLifecyclePolicyOutput.LifecyclePolicyDetail.Policy
operations:
  CreateCollection:
    output_wrapper_field_path: CreateCollectionDetail
  BatchGetCollection:
    operation_type:
    - List
    output_wrapper_field_path: CollectionDetails
    resource_name: Collection
  CreateCollectionGroup:
    output_wrapper_field_path: CreateCollectionGroupDetail
  BatchGetCollectionGroup:
    operation_type:
    - List
    output_wrapper_field_path: CollectionGroupDetails
    resource_name: CollectionGroup
  UpdateCollectionGroup:
    output_wrapper_field_path: UpdateCollectionGroupDetail
  BatchGetLifecyclePolicy:
    operation_type:
    - List
    output_wrapper_field_path: LifecyclePolicyDetails
    resource_name: LifecyclePolicy
    input_wrapper_field_path: Identifiers
resources:
  AccessPolicy:
  # Tags are not supported for AccessPolicy
  # https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-collection.html
    tags:
      ignore: true
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/access_policy/sdk_read_one_post_set_output.go.tpl
    fields:
      Type:
        go_tag: json:"type"
        is_immutable: true
      Policy:
        is_document: true
      Name:
        is_immutable: true
  SecurityPolicy:
  # Tags are not supported for SecurityPolicy 
  # https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-collection.html
    tags:
      ignore: true
    hooks:
      sdk_read_one_post_set_output:
        template_path: hooks/security_policy/sdk_read_one_post_set_output.go.tpl
      pre_populate_resource_from_annotation:
        template_path: hooks/security_policy/pre_populate_resource_from_annotation.go.tpl
      pre_set_resource_identifiers:
        template_path: hooks/security_policy/pre_set_resource_identifiers.go.tpl
    fields:
      Type:
        go_tag: json:"type"
        is_immutable: true
      Policy:
        is_document: true
      Name:
        is_immutable: true
  LifecyclePolicy:
  # Tags are not supported for LifecyclePolicy
  # https://docs.aws.amazon.com/opensearch-service/latest/developerguide/tag-collection.html
    tags:
      ignore: true
    hooks:
      sdk_read_many_post_request:
        template_path: hooks/lifecycle_policy/sdk_read_many_post_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/lifecycle_policy/sdk_read_many_post_set_output.go.tpl
    fields:
      Type:
        go_tag: json:"type"
        is_immutable: true
      Policy:
        is_document: true
      Name:
        is_primary_key: true
        is_immutable: true
  Collection:
    is_arn_primary_key: true
    fields:
      Type:
        is_immutable: true
        go_tag: json:"type,omitempty"
      Name:
        is_immutable: true
      StandbyReplicas:
        is_immutable: true
      # The public API accepts association only during CreateCollection.
      # Generic gap: optional create-only fields and reference wrappers can
      # escape immutability checks on absence/presence transitions. Suggested
      # code-generator issue: enforce optional field/reference immutability.
      CollectionGroupName:
        is_immutable: true
        references:
          resource: CollectionGroup
          path: Spec.Name
    hooks:
      sdk_update_pre_build_request:
        template_path: hooks/collection/sdk_update_pre_build_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/collection/sdk_read_many_post_set_output.go.tpl
  CollectionGroup:
    exceptions:
      errors:
        404:
          code: ResourceNotFoundException
    update_operation:
      # Capacity updates replace the whole object. Do not resend it on a
      # description-only update; nested changes still send every desired limit.
      omit_unchanged_fields: true
    fields:
      ID:
        is_primary_key: true
      Name:
        is_immutable: true
      StandbyReplicas:
        is_immutable: true
      Generation:
        is_immutable: true
        late_initialize:
          skip_incomplete_check: {}
      Description:
        late_initialize:
          skip_incomplete_check: {}
      Tags:
        # Create responses can omit modeled tags. Preserve desired tags in
        # operation results; ListTagsForResource supplies authoritative reads.
        # Boolean ignore skips output setters while retaining create inputs.
        set:
        - ignore: true
      CapacityLimits:
        late_initialize:
          skip_incomplete_check: {}
      CapacityLimits.MaxIndexingCapacityInOCU:
        late_initialize:
          skip_incomplete_check: {}
      CapacityLimits.MaxSearchCapacityInOCU:
        late_initialize:
          skip_incomplete_check: {}
      CapacityLimits.MinIndexingCapacityInOCU:
        late_initialize:
          skip_incomplete_check: {}
      CapacityLimits.MinSearchCapacityInOCU:
        late_initialize:
          skip_incomplete_check: {}
      CurrentCapacity:
        is_read_only: true
        from:
          operation: BatchGetCollectionGroup
          path: CollectionGroupDetails.CurrentCapacity
      NumberOfCollections:
        is_read_only: true
        from:
          operation: BatchGetCollectionGroup
          path: CollectionGroupDetails.NumberOfCollections
      MemberCollections:
        is_read_only: true
        from:
          operation: ListCollections
          path: CollectionSummaries
    hooks:
      sdk_read_many_post_request:
        template_path: hooks/collection_group/sdk_read_many_post_request.go.tpl
      sdk_read_many_post_set_output:
        template_path: hooks/collection_group/sdk_read_many_post_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/collection_group/sdk_update_pre_build_request.go.tpl
